server {
    listen 80;
    listen [::]:80;
    server_name tools.wonderstudio.tw;

    root /home/maxlin/Websites/www/tools;
    index index.html;

    # All routes are emitted by `next build`; no per-tool Nginx locations are needed.
    location / {
        try_files $uri $uri/ =404;
    }

    # Next fingerprints static assets. Cache them aggressively while keeping HTML fresh.
    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:wasm|woff2?|png|jpe?g|webp|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
}
